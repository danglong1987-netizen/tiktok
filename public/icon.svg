<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ttRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0050" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="ttCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#25f4ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Subtle glow circles -->
  <circle cx="160" cy="180" r="90" fill="#25f4ee" opacity="0.15" filter="url(#glow)" />
  <circle cx="340" cy="240" r="100" fill="#fe2c55" opacity="0.18" filter="url(#glow)" />

  <!-- TikTok Note Icon stylized with checkmark -->
  <!-- Cyan offset shadow -->
  <path d="M 290 120 C 310 160 345 185 390 190 L 390 235 C 355 235 325 220 305 200 L 305 325 C 305 380 260 415 205 415 C 150 415 110 375 110 320 C 110 265 155 225 210 225 C 220 225 230 227 240 230 L 240 280 C 230 275 220 272 210 272 C 182 272 160 294 160 320 C 160 346 182 368 210 368 C 238 368 258 348 258 320 L 258 120 Z" fill="#25f4ee" opacity="0.85" transform="translate(-10, -5)" />

  <!-- Magenta note overlay -->
  <path d="M 290 120 C 310 160 345 185 390 190 L 390 235 C 355 235 325 220 305 200 L 305 325 C 305 380 260 415 205 415 C 150 415 110 375 110 320 C 110 265 155 225 210 225 C 220 225 230 227 240 230 L 240 280 C 230 275 220 272 210 272 C 182 272 160 294 160 320 C 160 346 182 368 210 368 C 238 368 258 348 258 320 L 258 120 Z" fill="#fe2c55" opacity="0.85" transform="translate(10, 5)" />

  <!-- White note top -->
  <path d="M 290 120 C 310 160 345 185 390 190 L 390 235 C 355 235 325 220 305 200 L 305 325 C 305 380 260 415 205 415 C 150 415 110 375 110 320 C 110 265 155 225 210 225 C 220 225 230 227 240 230 L 240 280 C 230 275 220 272 210 272 C 182 272 160 294 160 320 C 160 346 182 368 210 368 C 238 368 258 348 258 320 L 258 120 Z" fill="#ffffff" />

  <!-- Green Verification / Check Badge in bottom right -->
  <circle cx="370" cy="370" r="64" fill="#10b981" stroke="#0f172a" stroke-width="8" />
  <path d="M 345 370 L 362 388 L 398 350" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
